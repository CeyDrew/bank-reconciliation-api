services:
  api:
    build:
      context: .
      dockerfile: src/Reconciliation.Api/Dockerfile
    container_name: recon-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=mssql,1433;Database=Reconciliation;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379"
      FakeBank__BaseUrl: "http://fake-bank:8080"
    ports:
      - "8080:8080"
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
      fake-bank:
        condition: service_started

  fake-bank:
    build:
      context: .
      dockerfile: src/Reconciliation.FakeBank/Dockerfile
    container_name: recon-fake-bank
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8081:8080"

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: recon-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: recon-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mssql-data:
