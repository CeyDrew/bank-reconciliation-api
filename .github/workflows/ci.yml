name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Integration tests start SQL Server and Redis with Testcontainers; the runner has Docker.
      - name: Test
        run: >
          dotnet test --no-build -c Release
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx"

      - name: Coverage report
        if: always()
        run: >
          dotnet reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:"coverage"
          -reporttypes:"MarkdownSummaryGithub;Cobertura;HtmlInline"
          && cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5

      - name: Build API image
        run: docker build -f src/Reconciliation.Api/Dockerfile -t bank-reconciliation-api:${{ github.sha }} .

      - name: Build FakeBank image
        run: docker build -f src/Reconciliation.FakeBank/Dockerfile -t bank-reconciliation-fakebank:${{ github.sha }} .
