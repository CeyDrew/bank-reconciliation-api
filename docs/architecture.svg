<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 600; fill: #0f172a; }
      .subtitle { font-size: 14px; fill: #475569; }
      .box-title { font-size: 16px; font-weight: 600; fill: #0f172a; }
      .text { font-size: 13px; fill: #334155; }
      .small { font-size: 12px; fill: #475569; }
      .edge { font-size: 12px; fill: #334155; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #475569; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="760" fill="#ffffff"/>
  <text x="40" y="48" class="title">bank-reconciliation-api — architecture</text>
  <text x="40" y="72" class="subtitle">Import bank movements, match payments to invoices, notify the ERP. All external systems are simulated by the FakeBank container.</text>

  <!-- Users -->
  <rect x="40" y="110" width="220" height="92" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="58" y="138" class="box-title">Users</text>
  <text x="58" y="160" class="text">Admin · Accountant</text>
  <text x="58" y="180" class="small">Swagger UI / HTTP client</text>

  <!-- FakeBank -->
  <rect x="40" y="300" width="220" height="190" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="58" y="328" class="box-title">FakeBank container</text>
  <text x="58" y="354" class="text">Bank statement API</text>
  <text x="58" y="372" class="small">paged, deterministic data,</text>
  <text x="58" y="388" class="small">11 scripted scenarios</text>
  <text x="58" y="414" class="text">Fake ERP receiver</text>
  <text x="58" y="432" class="small">verifies HMAC + timestamp,</text>
  <text x="58" y="448" class="small">drops duplicate events</text>
  <text x="58" y="474" class="small">Chaos: random 503s and latency</text>

  <!-- API container -->
  <rect x="340" y="100" width="600" height="470" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="128" class="box-title">Reconciliation API (.NET 10, ASP.NET Core)</text>

  <rect x="360" y="145" width="560" height="78" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="376" y="168" class="box-title">Api</text>
  <text x="376" y="189" class="text">Controllers · JWT bearer + roles · login rate limit · ProblemDetails</text>
  <text x="376" y="208" class="small">Swagger / OpenAPI · health: /health, /health/ready</text>

  <rect x="360" y="235" width="560" height="118" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="376" y="258" class="box-title">Application</text>
  <text x="376" y="280" class="text">Matching engine (scored, explained) · reconciliation · manual matching</text>
  <text x="376" y="300" class="text">Transaction import · reconciliation report · audit trail</text>
  <text x="376" y="320" class="text">Webhook outbox + dispatcher · FluentValidation</text>
  <text x="376" y="340" class="small">depends only on Domain and abstractions (IApplicationDbContext, IBankClient, IDistributedLock)</text>

  <rect x="360" y="365" width="270" height="110" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="376" y="388" class="box-title">Domain</text>
  <text x="376" y="410" class="text">Account · Customer · Invoice</text>
  <text x="376" y="428" class="text">BankTransaction · Match</text>
  <text x="376" y="446" class="text">Iban (mod-97) · TaxNumber (VKN)</text>
  <text x="376" y="464" class="small">no framework dependencies</text>

  <rect x="650" y="365" width="270" height="190" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="666" y="388" class="box-title">Infrastructure</text>
  <text x="666" y="410" class="text">EF Core (SQL Server), migrations</text>
  <text x="666" y="428" class="text">HttpClients + Polly resilience</text>
  <text x="666" y="446" class="text">Redis lock (SET NX PX)</text>
  <text x="666" y="464" class="text">JWT issuing · PBKDF2 hashing</text>
  <text x="666" y="482" class="text">HMAC-SHA256 webhook signing</text>
  <text x="666" y="506" class="text">Quartz.NET jobs</text>
  <text x="666" y="524" class="small">bank sync: every 5 min</text>
  <text x="666" y="541" class="small">webhook dispatch: every 10 s</text>

  <text x="376" y="510" class="small">Clean Architecture: dependencies point inwards;</text>
  <text x="376" y="527" class="small">architecture tests enforce it.</text>

  <!-- Data stores -->
  <rect x="360" y="630" width="270" height="96" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="376" y="656" class="box-title">SQL Server</text>
  <text x="376" y="678" class="text">accounts, invoices, transactions, matches</text>
  <text x="376" y="696" class="text">users · audit log · webhook outbox</text>
  <text x="376" y="714" class="small">rowversion, unique (account, bank tx id)</text>

  <rect x="650" y="630" width="270" height="96" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="666" y="656" class="box-title">Redis</text>
  <text x="666" y="678" class="text">distributed locks</text>
  <text x="666" y="696" class="small">one import / reconciliation / dispatch</text>
  <text x="666" y="714" class="small">at a time across API instances</text>

  <!-- Legend / flow -->
  <rect x="1000" y="110" width="240" height="330" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="1016" y="138" class="box-title">Flow</text>
  <text x="1016" y="164" class="text">1  Job pulls statements</text>
  <text x="1016" y="182" class="small">    overlap window, duplicates skipped</text>
  <text x="1016" y="208" class="text">2  Engine scores evidence</text>
  <text x="1016" y="226" class="small">    invoice no., IBAN/VKN, amount</text>
  <text x="1016" y="252" class="text">3  Score ≥ 80: match saved</text>
  <text x="1016" y="270" class="small">    + audit entry + outbox event</text>
  <text x="1016" y="288" class="small">    in one transaction</text>
  <text x="1016" y="314" class="text">4  Dispatcher signs and posts</text>
  <text x="1016" y="332" class="small">    Idempotency-Key, ordered,</text>
  <text x="1016" y="350" class="small">    backoff, dead letter</text>
  <text x="1016" y="376" class="text">5  People review the rest</text>
  <text x="1016" y="394" class="small">    suggestions, manual match,</text>
  <text x="1016" y="412" class="small">    reverse, ignore, report</text>

  <!-- Edges -->
  <path d="M260 156 L340 176" class="line"/>
  <text x="268" y="150" class="edge">HTTPS + JWT</text>

  <!-- API pulls statements from the bank and pushes webhooks to the ERP -->
  <path d="M340 372 L262 372" class="line"/>
  <text x="284" y="364" class="edge">GET</text>
  <path d="M340 432 L262 432" class="dashed"/>
  <text x="280" y="424" class="edge">POST</text>
  <text x="40" y="516" class="edge">GET: Polly retry, backoff, circuit breaker</text>
  <text x="40" y="534" class="edge">POST: HMAC-SHA256, Idempotency-Key</text>

  <!-- Infrastructure owns the connections to the data stores -->
  <path d="M700 555 L700 598 L495 598 L495 628" class="line"/>
  <path d="M850 555 L850 628" class="line"/>
</svg>
